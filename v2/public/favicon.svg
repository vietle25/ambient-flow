<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favWave" x1="8" y1="32" x2="56" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#F472B6" />
    </linearGradient>
    <linearGradient id="favBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <!-- Squircle rounded background -->
  <rect width="64" height="64" rx="18" fill="url(#favBg)" stroke="#A855F7" stroke-width="2" stroke-opacity="0.4" />

  <!-- Dotted orbit -->
  <circle cx="32" cy="32" r="21" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="3 4" fill="none" opacity="0.4" />

  <!-- Smooth Sine / Infinity Wave -->
  <path d="M 10 32 Q 21 16, 32 32 T 54 32" stroke="url(#favWave)" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Harmonic center node -->
  <circle cx="32" cy="32" r="4" fill="#F472B6" />
</svg>
