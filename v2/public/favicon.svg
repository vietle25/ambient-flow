<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background rounded squircle gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0B0F19" />
      <stop offset="100%" stopColor="#1E1B4B" />
    </linearGradient>

    <!-- F-Flow Harmonic Ribbon -->
    <linearGradient id="floumWave" x1="6" y1="12" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38BDF8" />
      <stop offset="45%" stopColor="#818CF8" />
      <stop offset="80%" stopColor="#C084FC" />
      <stop offset="100%" stopColor="#F472B6" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="48" height="48" rx="14" fill="url(#bgGrad)" stroke="#6366F1" stroke-width="1.2" stroke-opacity="0.3" />

  <!-- Orbit Harmonic Ring -->
  <circle cx="24" cy="24" r="16.5" stroke="#A855F7" stroke-width="1" stroke-dasharray="3 3.5" stroke-opacity="0.35" />

  <!-- Flowing 'F' / Wave Ribbon: A stylized fluid curve that evokes both 'F' and smooth soundwaves -->
  <path
    d="M 14 36 C 14 26, 17 14, 26 14 C 33 14, 37 18, 35 22 C 33 26, 23 25, 20 26 C 18 26.5, 17 28.5, 18 31 C 21 37, 34 35, 37 31"
    stroke="url(#floumWave)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#softGlow)"
  />

  <!-- Subtle 'F' cross flow dot -->
  <circle cx="31" cy="22" r="2.2" fill="#38BDF8" />
  <!-- Radiant Zen Core -->
  <circle cx="23" cy="26" r="2.8" fill="#F472B6" />
</svg>
